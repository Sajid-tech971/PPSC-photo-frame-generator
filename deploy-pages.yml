name: Deploy Photo Frame Website to GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Generate frame manifest from frames folder
        run: |
          python - <<'PY'
          import json, pathlib, re
          root = pathlib.Path('frames')
          allowed = {'.png', '.svg', '.jpg', '.jpeg', '.webp'}
          manifest_path = pathlib.Path('frames.json')
          frames_by_path = {}
          if manifest_path.exists():
              try:
                  for item in json.loads(manifest_path.read_text(encoding='utf-8')).get('frames', []):
                      if isinstance(item, dict) and item.get('path'):
                          frames_by_path[item['path']] = item
              except (ValueError, TypeError):
                  print('Warning: existing frames.json could not be parsed; rebuilding discovered entries')
          config_path = pathlib.Path('frame-config.json')
          configured = {}
          if config_path.exists():
              try:
                  configured = {item.get('filename'): item for item in json.loads(config_path.read_text(encoding='utf-8')).get('frames', []) if item.get('filename')}
              except (ValueError, TypeError):
                  print('Warning: frame-config.json could not be parsed; using default single-slot frames')
          for file in sorted(root.iterdir() if root.exists() else []):
              if file.is_file() and file.suffix.lower() in allowed:
                  name = re.sub(r'\.[^.]+$', '', file.name).replace('_', ' ').replace('-', ' ').title()
                  item = {'filename': file.name, 'name': name, 'path': 'frames/' + file.name}
                  slots = configured.get(file.name, {}).get('photoSlots')
                  if isinstance(slots, list) and slots:
                      item['photoSlots'] = slots
                  frames_by_path[item['path']] = item
          frames = sorted(frames_by_path.values(), key=lambda item: (item.get('name', '').casefold(), item.get('path', '').casefold()))
          pathlib.Path('frames.json').write_text(json.dumps({'frames': frames}, ensure_ascii=False, indent=2))
          print(f'Generated manifest for {len(frames)} frame(s)')
          PY
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
 
